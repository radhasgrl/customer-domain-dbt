name: dbt Build

# This repo's actual dbt build logic lives centrally in Repo 1
# (snowflake-platform-tf/.github/workflows/dbt-build-reusable.yml), not here — this file is
# deliberately a thin wrapper that only supplies this domain's own values. See Repo 1's
# README.md section "Centrally-maintained CI for Repo 3" for the full rationale: fixing a
# bug or adding a step to the dbt build process means editing that one file, once, in
# Repo 1 — every per-domain dbt repo referencing it picks up the change automatically.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  dbt:
    uses: radhasgrl/snowflake-platform-tf/.github/workflows/dbt-build-reusable.yml@main
    with:
      domain: customer
      dbt_project_name: customer_domain
      account: xygpmhm-gq04150
      user: GITHUB_DEV_DBT_SVC
      role: DEV_CUSTOMER_DBT_SERVICE_PRSN
      warehouse: DEV_CUSTOMER_TRANSFORM_WH
      database: DEV_CUSTOMER_DB
      schema: STAGING
      github_environment: DEV-dbt
