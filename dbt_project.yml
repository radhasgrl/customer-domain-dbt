name: 'customer_domain'
version: '1.0.0'
config-version: 2

profile: 'customer_domain'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  customer_domain:
    staging:
      +materialized: view
      +schema: STAGING
    marts:
      +materialized: table
      +schema: MARTS

# Ensures the RAW landing table exists (CREATE TABLE IF NOT EXISTS, see
# macros/create_raw_tables.sql) before any model that sources from it runs. Table DDL for
# RAW now lives here, in dbt (Repo 3) -- not in DCM (Repo 1), which continues to own only
# the RAW schema container and its grants.
on-run-start:
  - "{{ create_raw_customers_table() }}"
