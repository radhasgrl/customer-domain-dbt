version: 2

sources:
  - name: customer_raw
    database: "{{ target.database }}"
    schema: RAW
    description: >
      Raw landing zone for the Customer domain. Loaded by Repo 2 (data-ingestion-raw) via
      Snowpipe. Table DDL is created and owned by this repo (see
      macros/create_raw_tables.sql, invoked via on-run-start) -- Repo 1 (infra-snowflake)
      governs only the RAW schema container and its grants, not the table structure.
    tables:
      - name: customers
        identifier: CUSTOMERS
        description: Raw customer records as landed by Snowpipe.
        columns:
          - name: customer_id
            description: Unique customer identifier.
            tests:
              - unique
              - not_null
          - name: customer_name
            description: Customer display name.
